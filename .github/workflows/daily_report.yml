name: Update Daily Chicago Freight Report

on:
  schedule:
    # 8:00 AM Chicago Time (Central Time)
    # Note: 13:00 UTC = 8:00 AM CDT (during Daylight Saving Time)
    - cron: '0 13 * * *'
  workflow_dispatch: # This adds a manual "Run" button so you can test it anytime!

jobs:
  update-report:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run script to generate new report
        run: python scripts/generate_report.py

      - name: Save and commit new report data
        run: |
          git config --global user.name 'Freight-Bot'
          git config --global user.email 'freight-bot@users.noreply.github.com'
          git add data/latest.json
          git commit -m "Auto-update Chicago Freight Report [$(date +'%Y-%m-%d')]" || echo "No changes to commit"
          git push
